name: Build Cat Boss APK

on:
  push:
    branches: [ "agent/cat-boss-android-apk" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        working-directory: cat-boss-android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp cat-boss-android/app/build/outputs/apk/debug/app-debug.apk cat-boss-shooter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cat-boss-shooter-apk
          path: cat-boss-shooter.apk
          if-no-files-found: error
