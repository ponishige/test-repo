<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617;color:#fff;font-family:sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;font-weight:700;text-shadow:0 2px 4px #000}.panel{pointer-events:auto;position:absolute;inset:8% 5%;background:#071127ee;border:2px solid #6ff;border-radius:18px;padding:20px;overflow:auto;text-align:center}.hide{display:none}button{border:0;border-radius:12px;padding:13px 18px;margin:7px;font-size:16px;font-weight:800;background:#6ff;color:#03111a}.up{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;text-align:left;border:1px solid #456;padding:10px;border-radius:12px;margin:8px 0}.small{font-size:13px;color:#bcd}.title{font-size:28px;font-weight:900}.cat{font-size:70px}.toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:24px;font-weight:900;text-shadow:0 2px 8px #000}
</style></head><body><canvas id="c"></canvas><div id="ui"><div class="top"><span id="score">SCORE 0</span><span id="soul">SOUL 0</span><span id="life">♥♥♥</span></div><div id="toast" class="toast"></div><div id="menu" class="panel"><div class="cat">😾</div><div class="title">猫ボスシューティング</div><p>指で機体を動かします。自動射撃です。</p><button onclick="start()">スタート</button><button onclick="openUp()">強化</button><p class="small">敵を倒してSOULを集め、何度でも強化できます。</p></div><div id="ups" class="panel hide"><div class="title">無限強化</div><p>所持SOUL：<b id="bank"></b></p><div class="up"><div><b>攻撃力 LV.<span id="la"></span></b><div class="small">弾の威力が上がる</div></div><button onclick="buy('a')" id="ba"></button></div><div class="up"><div><b>ライフ LV.<span id="lh"></span></b><div class="small">開始時の体力が増える</div></div><button onclick="buy('h')" id="bh"></button></div><div class="up"><div><b>ショット LV.<span id="ls"></span></b><div class="small">弾数と集中威力が上がる</div></div><button onclick="buy('s')" id="bs"></button></div><button onclick="closeUp()">戻る</button></div><div id="over" class="panel hide"><div class="title">GAME OVER</div><p>今回の獲得SOUL：<b id="gain"></b></p><button onclick="start()">再挑戦</button><button onclick="openUp()">強化</button></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=1,run=false,t=0,score=0,gain=0,spawn=0,boss=null,beam=null,shots=[],enemies=[],eb=[],stars=[];let save=JSON.parse(localStorage.getItem('catBossSave')||'{"soul":0,"a":0,"h":0,"s":0}');
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,v:1+Math.random()*3}))}addEventListener('resize',rs);rs();
let p={x:W/2,y:H*.82,r:13,hp:3,cd:0,inv:0};function cost(k){let l=save[k];return Math.floor((k==='a'?12:k==='h'?25:18)*Math.pow(1.22,l))}function persist(){localStorage.setItem('catBossSave',JSON.stringify(save))}function q(id){return document.getElementById(id)}function show(id){['menu','ups','over'].forEach(a=>q(a).classList.toggle('hide',a!==id))}function openUp(){show('ups');refresh()}function closeUp(){show('menu')}function refresh(){q('bank').textContent=save.soul;['a','h','s'].forEach(k=>{q('l'+k).textContent=save[k];q('b'+k).textContent=cost(k)+' SOUL'})}function buy(k){let z=cost(k);if(save.soul>=z){save.soul-=z;save[k]++;persist();refresh()}}
function start(){show('');run=true;t=score=gain=spawn=0;shots=[];enemies=[];eb=[];boss=null;beam=null;p={x:W/2,y:H*.82,r:13,hp:3+save.h,cd:0,inv:0}}
function end(){run=false;save.soul+=gain;persist();q('gain').textContent=gain;show('over')}
function fire(){let n=Math.min(3+Math.floor(save.s/2),13),spread=.12;for(let i=0;i<n;i++){let a=(i-(n-1)/2)*spread;shots.push({x:p.x,y:p.y-16,vx:Math.sin(a)*7,vy:-11,dm:1+save.a*.38+Math.max(0,save.s-20)*.12})}}
function enemy(){let types=['●','◆','▼'],hp=2+Math.floor(t/1800);enemies.push({x:30+Math.random()*(W-60),y:-25,r:15,hp,v:1.2+Math.random()*1.4,s:types[Math.random()*3|0],cd:80+Math.random()*100})}
function makeBoss(){boss={x:W/2,y:100,r:58,hp:90+t/80,max:90+t/80,dir:1,cd:80,bc:190};toast('猫ボス！')}
function toast(s){q('toast').textContent=s;setTimeout(()=>q('toast').textContent='',900)}
function hit(a,b,r=(a.r||4)+(b.r||4)){return (a.x-b.x)**2+(a.y-b.y)**2<r*r}function hurt(){if(p.inv>0)return;p.hp--;p.inv=80;if(p.hp<=0)end()}
function update(){t++;stars.forEach(s=>{s.y+=s.v;if(s.y>H){s.y=0;s.x=Math.random()*W}});if(!run)return;if(p.inv>0)p.inv--;if(--p.cd<=0){fire();p.cd=Math.max(5,14-Math.floor(save.s/4))}if(!boss&&t%1500===0)makeBoss();if(!boss&&--spawn<=0){enemy();spawn=Math.max(24,75-t/900)}
shots.forEach(a=>{a.x+=a.vx;a.y+=a.vy});shots=shots.filter(a=>a.y>-30&&a.x>-30&&a.x<W+30);enemies.forEach(e=>{e.y+=e.v;e.cd--;if(e.cd<0){let a=Math.atan2(p.y-e.y,p.x-e.x);eb.push({x:e.x,y:e.y,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,r:5});e.cd=130}if(e.y>H+30)e.hp=0});
for(let s of shots)for(let e of enemies)if(s.dm&&hit(s,e)){e.hp-=s.dm;s.dm=0}enemies=enemies.filter(e=>{if(e.hp<=0){if(e.y<H){score+=10;gain++}return false}if(hit(e,p)){e.hp=0;hurt()}return true});
if(boss){boss.x+=boss.dir*1.5;if(boss.x<70||boss.x>W-70)boss.dir*=-1;if(--boss.cd<0){for(let i=-1;i<=1;i++){let a=Math.atan2(p.y-boss.y,p.x-boss.x)+i*.24;eb.push({x:boss.x,y:boss.y+25,vx:Math.cos(a)*1.8,vy:Math.sin(a)*1.8,r:6})}boss.cd=105}if(--boss.bc<0&&!beam){beam={warn:65,life:40,x:p.x};boss.bc=260}if(beam){beam.warn--;if(beam.warn<=0)beam.life--;if(beam.warn<=0&&Math.abs(p.x-beam.x)<22)hurt();if(beam.life<=0)beam=null}for(let s of shots)if(s.dm&&hit(s,boss)){boss.hp-=s.dm;s.dm=0}if(boss.hp<=0){score+=1000;gain+=35;boss=null;beam=null;toast('+35 SOUL')}}
eb.forEach(a=>{a.x+=a.vx;a.y+=a.vy;if(hit(a,p)){a.y=H+99;hurt()}});eb=eb.filter(a=>a.y<H+20&&a.x>-20&&a.x<W+20);q('score').textContent='SCORE '+score;q('soul').textContent='SOUL '+gain;q('life').textContent=p.hp>8?'♥ ×'+p.hp:'♥'.repeat(Math.max(0,p.hp))}
function draw(){x.fillStyle='#020617';x.fillRect(0,0,W,H);x.fillStyle='#8ef';stars.forEach(s=>x.fillRect(s.x,s.y,1.5,1.5));if(run){x.save();if(p.inv%10<5){x.translate(p.x,p.y);x.fillStyle='#6ff';x.beginPath();x.moveTo(0,-18);x.lineTo(-13,15);x.lineTo(0,9);x.lineTo(13,15);x.closePath();x.fill()}x.restore();x.fillStyle='#ffef7a';shots.forEach(a=>x.fillRect(a.x-2,a.y-7,4,14));x.fillStyle='#ff5b8a';eb.forEach(a=>{x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()});enemies.forEach(e=>{x.fillStyle='#f6c';x.font='28px sans-serif';x.textAlign='center';x.fillText(e.s,e.x,e.y+10)});if(boss){x.font='92px sans-serif';x.textAlign='center';x.fillText('😾',boss.x,boss.y+34);x.fillStyle='#222';x.fillRect(30,15,W-60,10);x.fillStyle='#ff674d';x.fillRect(30,15,(W-60)*boss.hp/boss.max,10);if(beam){x.strokeStyle=beam.warn>0?'#ffe96a88':'#ff314f';x.lineWidth=beam.warn>0?4:28;x.beginPath();x.moveTo(boss.x-22,boss.y);x.lineTo(beam.x,H);x.moveTo(boss.x+22,boss.y);x.lineTo(beam.x,H);x.stroke()}}}requestAnimationFrame(loop)}function loop(){update();draw()}loop();
let last=null;c.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!run||!last)return;p.x=Math.max(15,Math.min(W-15,p.x+e.clientX-last.x));p.y=Math.max(H*.35,Math.min(H-20,p.y+e.clientY-last.y));last={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',()=>last=null);
</script></body></html>
